# Local PostgreSQL only. The API and Next.js app are not containerized here.
# Production: Vercel (frontend) + Render (FastAPI) + managed Postgres. See DEPLOYMENT.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tradeguard}
    ports:
      - "5432:5432"
    volumes:
      - tradeguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradeguard_pg:
