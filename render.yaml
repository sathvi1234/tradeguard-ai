# Render: FastAPI API + managed PostgreSQL.
# Frontend is deployed separately (Vercel). Do not put secrets in this file.

databases:
  - name: trade-ai-db
    plan: free
    databaseName: tradeguard
    user: tradeguard

services:
  - type: web
    name: trade-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALPACA_PAPER_TRADE
        value: "true"
      - key: DRY_RUN
        value: "true"
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        fromDatabase:
          name: trade-ai-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
